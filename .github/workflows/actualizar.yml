name: Tests y actualización de datos

on:
  push:
  schedule:
    - cron: "0 12 20 * *"  # una vez por mes, cuando suele salir el RIPTE nuevo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests-y-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest -v test_analisis
      - name: Actualizar data.csv
        if: github.event_name != 'push'
        run: python analisis.py
      - name: Commit si cambió
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git diff --cached --quiet || git commit -m "Actualiza data.csv"
          git push
